[project]
name = "knowledge-base"
version = "0.1.0"
description = "Initial-encoding aid for structured study material via progressive masking and massed practice"
requires-python = ">=3.12"
dependencies = [
    "genanki>=0.13",
    "textual>=3.0",
    "requests>=2.31",
    "openpyxl>=3.1",
    "matplotlib>=3.8",
    "spacy>=3.7",
    "pandas>=3.0.3",
]

[project.scripts]
review-gen = "knowledge_base.srs.generation_tui:main"
gen-import = "knowledge_base.srs.generation_import:main"
gen-import-md = "knowledge_base.srs.md_importer:main"
gen-import-csv = "knowledge_base.srs.csv_importer:main"
code-review = "knowledge_base.code_review.tui:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
norecursedirs = ["tests/code_review/fixtures"]

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
